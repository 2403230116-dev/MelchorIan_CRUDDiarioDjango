<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Diario</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 30px;
        }

        .entrada {
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 700px;
        }

        h1 {
            color: #333;
        }

        .boton {
            text-decoration: none;
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
        }

        .editar {
            background-color: orange;
        }

        .eliminar {
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="entrada">

        <h1>{{ entrada.titulo }}</h1>

        <p>{{ entrada.contenido }}</p>

        <p>
            Fecha: {{ entrada.fecha_creacion }}
        </p>

        <br>

        <a class="boton"
           href="{% url 'diario_list' %}">
            Regresar
        </a>

        <a class="boton editar"
           href="{% url 'diario_update' entrada.pk %}">
            Editar
        </a>

        <a class="boton eliminar"
           href="{% url 'diario_delete' entrada.pk %}">
            Eliminar
        </a>

    </div>

</body>
</html>
