<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Diario</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 30px;
        }

        .formulario {
            background-color: white;
            padding: 20px;
            max-width: 600px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .cancelar {
            text-decoration: none;
            padding: 9px 15px;
            background-color: gray;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="formulario">

        <h1>Editar entrada</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Guardar cambios
            </button>

            <a class="cancelar"
               href="{% url 'diario_list' %}">
                Cancelar
            </a>

        </form>

    </div>

</body>
</html>
